name: autuax-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: autuax-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autuax}
      POSTGRES_USER: ${POSTGRES_USER:-autuax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autuax} -d ${POSTGRES_DB:-autuax}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - autuax_network

  redis:
    image: redis:7-alpine
    container_name: autuax-prod-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - autuax_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: autuax-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-autuax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autuax}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    ports:
      - "${API_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - autuax_network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: autuax-prod-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-autuax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autuax}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    networks:
      - autuax_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: autuax-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - autuax_network

networks:
  autuax_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
