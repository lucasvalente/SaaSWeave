name: saasweave

# Production deployment. The only host-published application ports belong to
# Caddy. Database, Redis, object storage, the server, and the runtime
# controller remain private Docker services.
x-app-env: &app-env
  VITE_SERVER_URL: ${VITE_SERVER_URL:?Set the public HTTPS API URL}
  VITE_WEB_URL: ${VITE_WEB_URL:?Set the public HTTPS application URL}
  DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
  NODE_ENV: production
  SOURCE_COMMIT: ${SOURCE_COMMIT:?Set SOURCE_COMMIT to the immutable release revision}

x-production-container: &production-container
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64M,mode=1777,noexec,nosuid
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1536M
        pids: 512

x-server-env: &server-env
  <<: *app-env
  INTERNAL_SERVER_URL: http://server:5000/server
  ENABLE_OPEN_API_DOCS: "false"
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:?Set at least one platform administrator email}
  REQUIRE_EMAIL_VERIFICATION: "true"
  TRUST_PROXY_HEADERS: "true"
  REDIS_URL: redis://redis:6379/0
  CACHE_PREFIX: ${CACHE_PREFIX:-saasweave}
  CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-300}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-saasweave}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICES: ${STRIPE_PRICES:-{}}
  STRIPE_METERS: ${STRIPE_METERS:-{}}
  MAIL_PROVIDER: ${MAIL_PROVIDER:?Set MAIL_PROVIDER to resend or smtp}
  MAIL_FROM: ${MAIL_FROM:?Set a verified MAIL_FROM address}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_URL: ${SMTP_URL:-}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
  MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:?Set MINIO_ACCESS_KEY_ID}
  MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:?Set MINIO_SECRET_ACCESS_KEY}
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:?Set the public uploads URL}
  MEDIA_UPLOAD_DIR: .uploads
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?Set the public media URL}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?Set METRICS_BEARER_TOKEN}
  OTEL_TRACE_SAMPLE_RATE: ${OTEL_TRACE_SAMPLE_RATE:-0.1}
  RETENTION_PURGE_DRY_RUN: ${RETENTION_PURGE_DRY_RUN:-false}
  RETENTION_LEGAL_HOLD_ORG_IDS: ${RETENTION_LEGAL_HOLD_ORG_IDS:-}
  SECURITY_HEADERS_ENABLED: "true"
  SECURITY_CSP_REPORT_ONLY: "false"
  SECURITY_CSP_REPORT_URI: ${SECURITY_CSP_REPORT_URI:-}
  SANDBOX_RUNTIME_CONTROLLER_URL: http://sandbox-runtime:8787
  RUNTIME_CONTROLLER_TOKEN: ${RUNTIME_CONTROLLER_TOKEN:?Set RUNTIME_CONTROLLER_TOKEN}
  SANDBOX_PREVIEW_HOST: host.docker.internal

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN without a scheme}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - saasweave-caddy-data:/data
      - saasweave-caddy-config:/config
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrator
    environment:
      <<: *server-env
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *production-container
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT}
        VITE_SERVER_URL: ${VITE_SERVER_URL}
        VITE_WEB_URL: ${VITE_WEB_URL}
        MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL}
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *server-env
    networks: [app, data, sandbox-control]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      sandbox-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/server/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    <<: *production-container
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT}
        VITE_SERVER_URL: ${VITE_SERVER_URL}
        VITE_WEB_URL: ${VITE_WEB_URL}
        VITE_IMGPROXY_URL: ${VITE_IMGPROXY_URL:?Set VITE_IMGPROXY_URL}
        VITE_IMGPROXY_SIGNATURE: ${VITE_IMGPROXY_SIGNATURE:-_}
        VITE_IMGPROXY_SOURCE_WEB_URL: http://web:3000
        MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL}
    restart: unless-stopped
    environment:
      <<: *server-env
      VITE_IMGPROXY_URL: ${VITE_IMGPROXY_URL}
      VITE_IMGPROXY_SIGNATURE: ${VITE_IMGPROXY_SIGNATURE:-_}
      VITE_IMGPROXY_SOURCE_WEB_URL: http://web:3000
    networks: [app, data, sandbox-control]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/_api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *production-container
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT}
        VITE_SERVER_URL: ${VITE_SERVER_URL}
        VITE_WEB_URL: ${VITE_WEB_URL}
        MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL}
    restart: unless-stopped
    environment:
      <<: *server-env
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  sandbox-runtime:
    build:
      context: .
      dockerfile: apps/sandbox-runtime/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      RUNTIME_CONTROLLER_TOKEN: ${RUNTIME_CONTROLLER_TOKEN}
    volumes:
      # The runtime controller is the only production service with Docker authority.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [sandbox-control]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [saasweave-pg-data:/var/lib/postgresql]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [saasweave-redis-data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
    volumes: [saasweave-minio-data:/data]
    networks: [app, data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$MINIO_BUCKET || true"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
    networks: [data]
    restart: "no"

  imgproxy:
    image: darthsim/imgproxy:v3.28.0
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ALLOW_INSECURE: "1"
      IMGPROXY_ALLOWED_SOURCES: "${MINIO_PUBLIC_BASE_URL},${VITE_WEB_URL}/,http://web:3000/"
    networks: [app, data]

volumes:
  saasweave-caddy-data:
  saasweave-caddy-config:
  saasweave-pg-data:
  saasweave-redis-data:
  saasweave-minio-data:

networks:
  app:
    internal: true
  data:
    internal: true
  sandbox-control:
    internal: true
  # Controller-created sandboxes and loopback gateways use these canonical names.
  sandbox-preview-network:
    name: sandbox-preview-network
    internal: true
  sandbox-preview-gateway-network:
    name: sandbox-preview-gateway-network
